discord:
  token: ${DISCORD_TOKEN}

channels:
  - source: 123456789          # Replace with actual channel ID to read from
    target: 987654321          # Replace with actual channel ID to post summary to
    schedule: "0 8 * * *"      # Daily at 8 AM UTC (cron expression)
    window_hours: 24           # Look back 24 hours

api_call_budget: 100           # Max API calls per job (prevents rate limit exhaustion)

summarization:
  strategy: "lexrank"          # lexrank | textrank | luhn | heuristic
  min_messages: 5              # Skip summary if fewer messages
  
  sentences_per_n_messages: 20 # ~1 sentence per N messages
  min_sentences: 3             # Minimum summary length
  max_sentences: 15            # Maximum summary length

  reaction_weight: 3.0         # Signal scoring weights (Phase 2)
  reply_depth_weight: 2.0
  length_weight: 1.0
  url_bonus: 1.5
  
  message_links_enabled: false # MVP disabled; Phase 2 feature
  signal_threshold: 4.0        # Link high-signal messages if enabled
  
nlp:
  spacy_model: "en_core_web_sm"
  max_topics: 5
  enable_ner: true             # Tier 2 stubbed for MVP

logging:
  level: INFO
